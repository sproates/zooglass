name: Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope
        type: choice
        options: [full, selected]
        default: full
      compare_ref:
        description: Base ref for selected mode (ignored by full scope)
        type: string
        default: origin/main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    # no-ci starts no runners. Main PRs and explicit manual runs always take precedence.
    if: >-
      github.event_name == 'workflow_dispatch' || github.base_ref == 'main' ||
      (!contains(format('/{0}/', github.head_ref), '/no-ci/') &&
       !contains(format('/{0}/', github.base_ref), '/no-ci/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
      - run: node --test .github/ci/*.test.mjs
      - id: select
        run: node .github/ci/select.mjs
      - run: node .github/ci/docs.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: validation-plan
          path: validation-plan.json

  java:
    needs: select
    if: fromJSON(needs.select.outputs.plan).java
    uses: ./.github/workflows/zooglass.yml

  workbench:
    needs: select
    if: >-
      fromJSON(needs.select.outputs.plan).static || fromJSON(needs.select.outputs.plan).core ||
      fromJSON(needs.select.outputs.plan).demo || fromJSON(needs.select.outputs.plan).browser ||
      fromJSON(needs.select.outputs.plan).native || fromJSON(needs.select.outputs.plan).engines
    uses: ./.github/workflows/workbench.yml
    with:
      plan: ${{ needs.select.outputs.plan }}

  validation-gate:
    # Manual selected runs must never satisfy the PR's required gate context.
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-validation' || 'validation-gate' }}
    needs: [select, java, workbench]
    if: always() && needs.select.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
      - name: Require successful selection
        env:
          SELECTION: ${{ needs.select.result }}
        run: test "$SELECTION" = success
      - run: node .github/ci/gate.mjs
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
          GROUPS: '{"java":["java"],"workbench":["static","core","demo","browser","native","engines"]}'
