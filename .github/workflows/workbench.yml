name: Workbench CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
