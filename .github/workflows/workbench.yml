name: Workbench CI

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    if: fromJSON(inputs.plan).static || fromJSON(inputs.plan).core || fromJSON(inputs.plan).demo
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - uses: actions/setup-java@v6
        if: fromJSON(inputs.plan).core
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml

      - run: npm ci
      - name: Build ZooGlass once before service tests
        if: fromJSON(inputs.plan).core
        run: npm run prepare:service
      - run: npm run lint
        if: fromJSON(inputs.plan).static
      - run: npm run format:check
        if: fromJSON(inputs.plan).static
      - name: Verify core checks without a vehicle build or browser binaries
        if: fromJSON(inputs.plan).core
        shell: bash
        run: |
          test ! -d ../demos/vehicle-tracker/dist
          core_browser_cache="$(mktemp -d)"
          test -z "$(ls -A "$core_browser_cache")"
          PLAYWRIGHT_BROWSERS_PATH="$core_browser_cache" npx c8 --reports-dir=coverage/standard npm run test:core
          test ! -d ../demos/vehicle-tracker/dist
          test -z "$(ls -A "$core_browser_cache")"
      - name: Build demo assets once
        if: fromJSON(inputs.plan).demo
        run: npm run build:browser
      - name: Add demo-unit coverage without repeating core tests
        if: fromJSON(inputs.plan).demo
        run: npx c8 --clean=${{ !fromJSON(inputs.plan).core }} --reports-dir=coverage/standard npx tsx --test test/demo-unit/*.test.ts
      - run: npx tsc -p tsconfig.json
        if: fromJSON(inputs.plan).static
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workbench-standard-coverage
          path: workbench/coverage/standard/
          if-no-files-found: warn

  browser-host:
    if: fromJSON(inputs.plan).browser
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Keep the image version aligned with package-lock.json's Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      # Maven's user home must match the home used by setup-java's cache.
      MAVEN_OPTS: -Duser.home=/github/home
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml
      - run: npm ci
      - name: Build ZooGlass once before service tests
        run: npm run prepare:service
      - run: npm run test:browser:coverage
      - run: npm run test:resources
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-check-failures
          path: workbench/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workbench-browser-host-coverage
          path: workbench/coverage/browser-host/
          if-no-files-found: warn

  native-lifecycle:
    if: fromJSON(inputs.plan).native
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml
      - run: npm ci
      - name: Build ZooGlass once before service tests
        run: npm run prepare:service
      - run: npx playwright install chromium
      - name: Verify artifact-only concurrent launches and restart
        run: npx tsx --test test/prebuilt-service.test.ts
      - run: npm run test:resources
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: lifecycle-failure-${{ matrix.os }}
          path: workbench/test-results/
          if-no-files-found: ignore

  browser-engines:
    if: fromJSON(inputs.plan).engines
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      # Maven's user home must match the home used by setup-java's cache.
      MAVEN_OPTS: -Duser.home=/github/home
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml
      - run: npm ci
      - name: Build ZooGlass once before service tests
        run: npm run prepare:service
      - name: Align container home ownership for Firefox
        if: matrix.engine == 'firefox'
        run: chown "$(id -u):$(id -g)" "$HOME"
      - run: npm run test:engines
        env:
          WORKBENCH_TEST_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: engine-failure-${{ matrix.engine }}
          path: workbench/test-results/
          if-no-files-found: ignore

  workbench-gate:
    needs: [test-and-build, browser-host, native-lifecycle, browser-engines]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: workbench/.nvmrc
      - run: node .github/ci/gate.mjs
        env:
          PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
          GROUPS: '{"test-and-build":["static","core","demo"],"browser-host":["browser"],"native-lifecycle":["native"],"browser-engines":["engines"]}'
