name: Workbench CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"
      - "incubator/vehicle-tracker/**"
      - "incubator/zooglass/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"
      - "incubator/vehicle-tracker/**"
      - "incubator/zooglass/**"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
