name: Workbench CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"
      - "incubator/vehicle-tracker/**"
      - "incubator/zooglass/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workbench.yml"
      - "incubator/workbench/**"
      - "incubator/vehicle-tracker/**"
      - "incubator/zooglass/**"

# Stop obsolete PR runs when a newer revision is pushed. Main runs finish normally.
concurrency:
  group: workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Verify core checks without a vehicle build or browser binaries
        shell: bash
        run: |
          test ! -d ../vehicle-tracker/dist
          core_browser_cache="$(mktemp -d)"
          test -z "$(ls -A "$core_browser_cache")"
          PLAYWRIGHT_BROWSERS_PATH="$core_browser_cache" npx c8 --reports-dir=coverage/standard npm run test:core
          test ! -d ../vehicle-tracker/dist
          test -z "$(ls -A "$core_browser_cache")"
      - name: Add demo-unit coverage without repeating core tests
        run: npx c8 --clean=false --reports-dir=coverage/standard npm run test:demo-unit
      - run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workbench-standard-coverage
          path: incubator/workbench/coverage/standard/
          if-no-files-found: warn

  browser-host:
    runs-on: ubuntu-latest
    # Keep the image version aligned with package-lock.json's Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      # Maven's Java home must match the home used by setup-java's cache.
      MAVEN_OPTS: -Duser.home=/github/home
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml
      - run: npm ci
      - run: npm run test:browser:coverage
      - run: npm run test:resources
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-check-failures
          path: incubator/workbench/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workbench-browser-host-coverage
          path: incubator/workbench/coverage/browser-host/
          if-no-files-found: warn

  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:resources
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: lifecycle-failure-${{ matrix.os }}
          path: incubator/workbench/test-results/
          if-no-files-found: ignore

  browser-engines:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      # Maven's Java home must match the home used by setup-java's cache.
      MAVEN_OPTS: -Duser.home=/github/home
    timeout-minutes: 15
    defaults:
      run:
        working-directory: incubator/workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: incubator/workbench/.nvmrc
          cache: npm
          cache-dependency-path: incubator/workbench/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml
      - run: npm ci
      - name: Align container home ownership for Firefox
        if: matrix.engine == 'firefox'
        run: chown "$(id -u):$(id -g)" "$HOME"
      - run: npm run test:engines
        env:
          WORKBENCH_TEST_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: engine-failure-${{ matrix.engine }}
          path: incubator/workbench/test-results/
          if-no-files-found: ignore
