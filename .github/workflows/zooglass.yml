name: ZooGlass CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zooglass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml

      - run: ./mvnw --batch-mode verify
      - name: Verify PostgreSQL storage using prepared test classes
        run: python3 scripts/test-postgresql.py
      - name: Prepare capture-fence negative controls explicitly
        run: |
          ./mvnw --batch-mode dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/ha-test-classpath.txt
          python3 scripts/prepare-ha-controls.py --test-classpath target/ha-test-classpath.txt
      - name: Verify real-read fence controls using prepared classes
        run: python3 scripts/test-postgresql.py --ha-controls
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zooglass-coverage
          path: |
            zooglass/target/site/jacoco/
            zooglass/target/resource-observations.json
            zooglass/target/ha-fence-controls/manifest.json
            zooglass/target/ha-fence-controls/results.json
            zooglass/target/surefire-reports/
          if-no-files-found: warn
