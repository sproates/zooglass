name: ZooGlass CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zooglass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: zooglass/pom.xml

      - run: ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zooglass-coverage
          path: |
            zooglass/target/site/jacoco/
            zooglass/target/resource-observations.json
          if-no-files-found: warn
