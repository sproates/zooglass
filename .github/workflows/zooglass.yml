name: ZooGlass CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zooglass.yml"
      - "incubator/zooglass/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zooglass.yml"
      - "incubator/zooglass/**"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/zooglass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: incubator/zooglass/pom.xml

      - run: ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zooglass-coverage
          path: incubator/zooglass/target/site/jacoco/
          if-no-files-found: warn
