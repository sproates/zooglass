<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">ZooGlass, demo applications and Workbench</title>
  <desc id="desc">Read the right-hand stack upwards: simulated sources send events to ZooGlass, which maintains live views and delivers snapshots to demo applications. Workbench sits alongside, generating source events, introducing delivery faults and checking the resulting views. Demo applications present real ZooGlass data; Workbench expectations do not populate the views. ZooGlass is highlighted in purple as the core service. This is the demonstration and verification environment.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286552"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496aaf"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182c40}
      .heading{font-size:26px;font-weight:700}.label{font-size:23px;font-weight:700}
      .body{font-size:19px}.note{font-size:17px;fill:#40566d}
      .core text{fill:#fff}.core .label{font-size:26px}
      .flow{stroke:#286552;stroke-width:3;fill:none;marker-end:url(#data)}
      .check{stroke:#496aaf;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#control)}
    </style>
  </defs>
  <rect width="960" height="650" rx="16" fill="#fff"/>
  <text x="32" y="42" class="heading">From source events to live applications</text>
  <text x="32" y="72" class="note">The demonstration and verification environment</text>

  <rect x="32" y="106" width="268" height="454" rx="14" fill="#edf2fc" stroke="#496aaf" stroke-width="2"/>
  <text x="54" y="146" class="label">Workbench</text>
  <text x="54" y="176" class="body">Scenario Simulator</text>
  <text x="54" y="216" class="note">Runs scenarios</text>
  <text x="54" y="244" class="note">Introduces delivery faults</text>
  <text x="54" y="272" class="note">Verifies real outcomes</text>
  <text x="54" y="350" class="body">Independent checks</text>
  <text x="54" y="506" class="body">Simulated inputs</text>

  <rect x="560" y="106" width="368" height="124" rx="14" fill="#f0f8f4" stroke="#43866e" stroke-width="2"/>
  <text x="584" y="146" class="label">Demo applications</text>
  <text x="584" y="177" class="body">Show the resulting live views</text>
  <text x="584" y="207" class="note">Presentation and domain experience</text>

  <g class="core">
  <rect x="560" y="300" width="368" height="124" rx="14" fill="#56378a" stroke="#402568" stroke-width="3"/>
  <text x="584" y="340" class="label">ZooGlass</text>
  <text x="584" y="371" class="body">Maintains and delivers live views</text>
  <text x="584" y="401" class="note">Applies configured field policies</text>
  </g>

  <rect x="560" y="484" width="368" height="76" rx="14" fill="#f0f8f4" stroke="#43866e" stroke-width="2"/>
  <text x="584" y="516" class="label">Simulated sources</text>
  <text x="584" y="544" class="note">Independent event streams</text>

  <path d="M744 484V424" class="flow"/>
  <text x="762" y="462" class="note">Events</text>
  <path d="M744 300V230" class="flow"/>
  <text x="762" y="271" class="note">Snapshots</text>
  <path d="M300 196H560" class="check"/>
  <text x="320" y="182" class="note">Demo-specific UI checks</text>
  <path d="M300 362H560" class="check"/>
  <text x="320" y="348" class="note">Check service views</text>
  <path d="M300 524H560" class="check"/>
  <text x="320" y="510" class="note">Generate events + faults</text>

  <path d="M32 602H80" class="flow"/>
  <text x="96" y="608" class="note">Application data path</text>
  <path d="M340 602H388" class="check"/>
  <text x="404" y="608" class="note">Scenario control and verification</text>
</svg>
