<path d="M875 345V304" class="link"/><text x="637" y="313" class="detail">Bridge operates app socket</text>
<rect x="595" y="465" width="325" height="85" rx="12" fill="#edf2fc" stroke="#496aaf" stroke-width="2"/>
<text x="619" y="500" class="label">Data proxy / fault gate</text><text x="619" y="529" class="detail">Break only this data path</text>
