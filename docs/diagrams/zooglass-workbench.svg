<text x="42" y="894" class="small">Blue: test machinery and control. Green: application components and data flow.</text>
<text x="42" y="923" class="small">The blue proxy carries real data and lets Workbench interrupt that connection.</text>
<text x="42" y="955" class="detail">Subscriptions travel down the data path. Control stays available when that path breaks.</text>
