<path d="M310 285H615" class="link" stroke-dasharray="6 4"/><text x="335" y="272" class="detail">Observe rendered state</text>
<path d="M310 374H615" class="link" marker-start="url(#control)"/><text x="335" y="360" class="detail">Commands / observations</text>
