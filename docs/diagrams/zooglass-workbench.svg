<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980" role="img" aria-labelledby="title desc">
<title id="title">Building and testing ZooGlass with Workbench</title>
<desc id="desc">Implemented vehicle-demo environment with browser orchestration and a data-connection fault gate. This is the local verification setup, not a production deployment. The real browser, data proxy, ZooGlass and simulated source form a vertical stack on the right. Workbench runs alongside on the left, with horizontal connections to launch and inspect the browser, command its control bridge, break or restore the data proxy, check ZooGlass processing and advance source events. Vehicle data flows up the stack independently of orchestration. Blue identifies test machinery, including the data proxy and fault gate.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286552"/></marker>
 <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#496aaf"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#182c40}.heading{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:17px}.detail{font-size:16px;fill:#40566d}.flow{stroke:#286552;stroke-width:3;fill:none;marker-end:url(#arrow)}.link{stroke:#496aaf;stroke-width:2;fill:none;marker-end:url(#control)}</style>
</defs>
<rect width="960" height="980" fill="#fff"/>
